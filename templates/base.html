<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake News Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      body{
        background: radial-gradient(1200px 600px at 20% 0%, #f7f9ff 0, #eef2ff 50%, #e8ecff 100%);
        min-height: 100vh;
      }
      .glass {
        background: rgba(255,255,255,0.75);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      }
      .pill {
        display:inline-block;padding:6px 12px;border-radius:999px;background:#f1f5ff;font-weight:600;
      }
    </style>
  </head>
  <body class="pb-5">
    <nav class="navbar navbar-light pt-3">
      <div class="container">
        <span class="navbar-brand mb-0 h1">🛡️ Fake News Checker</span>
        <span class="pill">Flask · Local-first</span>
      </div>
    </nav>
    <div class="container mt-3">
      {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
